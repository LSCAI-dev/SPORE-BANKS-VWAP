{"name": "Update bank data",
 "on": {"schedule": [{"cron": "20 10 * * 1-5"}, {"cron": "50 12 * * 1-5"}, {"cron": "20 15 * * 1-5"}, {"cron": "20 23 * * 0-4"}],
        "workflow_dispatch": {}},
 "permissions": {"contents": "write"},
 "concurrency": {"group": "update-data", "cancel-in-progress": false},
 "jobs": {"update": {"runs-on": "ubuntu-latest", "steps": [
  {"uses": "actions/checkout@v4"},
  {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}},
  {"name": "Install dependencies", "run": "pip install yfinance pandas"},
  {"name": "Fetch latest prices", "run": "python scripts/update_data.py"},
  {"name": "Save today's scan and fill next-day prices", "run": "python scripts/scan.py"},
  {"name": "Commit changes", "run": "git config user.name 'github-actions[bot]' && git config user.email '41898299+github-actions[bot]@users.noreply.github.com' && git add data.json scans.json scan_log.csv && (git diff --cached --quiet && echo 'No changes' || (git commit -m \"Update bank data and scan log $(date -u +%Y-%m-%d)\" && git push))"}
 ]}}}
